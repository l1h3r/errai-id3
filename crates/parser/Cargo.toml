[package]
name = "parser"
description = "A zero-copy ID3v2 tag parser"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
readme = "README.md"
publish = false

[dependencies]
bitflags = { version = "2.6", default-features = false }
byteorder = { version = "1.5", default-features = false, features = ["std"] }
derive = { version = "=0.1.0", path = "../derive" }
flate2 = { version = "1.0", default-features = false, features = ["rust_backend"], optional = true }
memchr = { version = "2.7", default-features = false, features = ["std"] }

[features]
default = ["zlib"]

# Enables ZLIB decompression of compressed frames.
zlib = ["dep:flate2"]

[lints]
workspace = true
